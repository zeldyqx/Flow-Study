<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Study — Auth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            height: 100vh;
            background-color: #18181b;
            overflow: hidden;
            position: relative;
            display: flex;
        }

        /* Right Hero Section */
        .hero-section {
            position: absolute;
            top: 0;
            right: 0;
            width: 60vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            padding-right: 12vw;
            color: #ffffff;
            z-index: 0;
        }

        .hero-content {
            max-width: 420px;
        }

        .hero-title {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.8rem;
        }

        .hero-description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #a1a1aa;
            font-weight: 400;
        }

        .hero-links {
            position: absolute;
            bottom: 3rem;
            right: 12vw;
            display: flex;
            gap: 2rem;
        }

        .hero-links a {
            color: #888888;
            font-size: 1.05rem;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .hero-links a:hover {
            color: #ffffff;
        }

        /* Left white diagonal section */
        .white-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 48vw;
            height: 100vh;
            background: #ffffff;
            clip-path: polygon(0 0, 70% 0, 100% 100%, 0 100%);
            display: flex;
            align-items: center;
            padding-left: 6%;
            z-index: 1;
        }

        .auth-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #eaeaea;
            width: 340px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: none;
            border: none;
            color: #555555;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 1rem;
            padding: 0;
            transition: color 0.2s ease;
        }

        .back-btn:hover {
            color: #000000;
        }

        .back-btn svg {
            width: 16px;
            height: 16px;
        }

        .header-container {
            margin-bottom: 1.2rem;
        }

        .auth-card h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            color: #111111;
            line-height: 1.2;
        }

        .auth-prompt {
            font-size: 0.85rem;
            color: #666666;
            line-height: 1.2;
        }

        .auth-prompt button {
            background: none;
            border: none;
            color: #000000;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            font-size: 0.85rem;
        }

        .google-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.7rem;
            background: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #333333;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .google-btn:hover {
            background: #f8f8f8;
            border-color: #bbbbbb;
        }

        .google-btn svg {
            width: 18px;
            height: 18px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.2rem 0;
            color: #aaa;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #eaeaea;
        }

        .divider span {
            padding: 0 0.6rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 0.8rem;
            min-height: 68px; 
            max-height: 100px;
            opacity: 1;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.2s ease,
                        margin-bottom 0.3s ease,
                        min-height 0.3s ease;
        }

        .input-group.collapsed {
            max-height: 0;
            min-height: 0;
            opacity: 0;
            margin-bottom: 0;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #dddddd;
            border-radius: 6px;
            background: #fdfdfd;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #000000;
            background: #ffffff;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 2.5rem;
        }

        .toggle-password {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #71717a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.2rem;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #000000;
        }

        .toggle-password svg {
            width: 18px;
            height: 18px;
        }

        .input-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: -0.4rem;
            margin-bottom: 0.8rem;
            font-size: 0.8rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: #555555;
            cursor: pointer;
            user-select: none;
        }

        .remember-me input {
            cursor: pointer;
            accent-color: #000000;
        }

        .forgot-link {
            color: #000000;
            text-decoration: none;
            font-weight: 500;
            margin-left: auto;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .status-msg {
            font-size: 0.75rem;
            margin-top: 0.2rem;
            display: block;
            min-height: 1rem;
        }

        .status-msg.available { color: #10b981; }
        .status-msg.taken, .status-msg.invalid { color: #ef4444; }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background: #000000;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 0.2rem;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #222222;
        }

        .terms-text {
            font-size: 0.75rem;
            color: #71717a;
            text-align: center;
            margin-top: 0.8rem;
            line-height: 1.3;
        }

        .terms-text a {
            color: #000000;
            text-decoration: underline;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            body {
                justify-content: center;
                align-items: center;
            }
            .hero-section {
                display: none;
            }
            .white-section {
                width: 100vw;
                clip-path: none;
                padding-left: 0;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">Flow Study</h1>
            <p class="hero-description">
                Your study notes, minus the chaos. Organize lectures, break down heavy topics, and actually retain what you learn.
            </p>
        </div>

        <div class="hero-links">
            <a href="#">About</a>
            <a href="#">Features</a>
            <a href="#">Privacy</a>
        </div>
    </div>

    <div class="white-section">
        <div class="auth-card">
            <button type="button" class="back-btn" id="back-btn" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to login
            </button>

            <div class="header-container">
                <h2 id="form-title">Sign Up</h2>
                <p class="auth-prompt" id="form-prompt">
                    Already have an account? <button type="button" id="toggle-btn">Log in</button>
                </p>
            </div>

            <button type="button" class="google-btn" id="google-btn">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Continue with Google
            </button>

            <div class="divider" id="divider">
                <span>OR</span>
            </div>
            
            <form id="auth-form" novalidate>
                <div class="input-group" id="username-group">
                    <input type="text" id="username" placeholder="Username" autocomplete="off">
                    <span class="status-msg" id="username-status"></span>
                </div>
                
                <div class="input-group" id="login-group">
                    <input type="text" id="login-identifier" placeholder="Email address" autocomplete="off">
                    <span class="status-msg" id="login-status"></span>
                </div>
                
                <div class="input-group" id="password-group">
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Password">
                        <button type="button" class="toggle-password" id="toggle-password-btn" aria-label="Toggle password visibility">
                            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <span class="status-msg"></span>
                </div>

                <div class="input-options" id="login-options" style="display: none;">
                    <label class="remember-me" id="remember-me-label">
                        <input type="checkbox" id="remember-me-checkbox">
                        Remember me
                    </label>
                    <a href="#" class="forgot-link" id="forgot-password-link">Forgot password?</a>
                </div>
                
                <button type="submit" class="submit-btn" id="submit-btn">Create Account</button>

                <p class="terms-text" id="terms-text">
                    By signing up, you agree to our <a href="#">Terms</a> & <a href="#">Privacy Policy</a>.
                </p>
            </form>
        </div>
    </div>

    <script>
        let currentMode = 'signup';

        const takenUsernames = ['admin', 'alex', 'kywy'];
        const takenEmails = ['test@mail.com', 'user@gmail.com'];

        const form = document.getElementById('auth-form');
        const title = document.getElementById('form-title');
        const prompt = document.getElementById('form-prompt');
        const toggleBtn = document.getElementById('toggle-btn');
        const backBtn = document.getElementById('back-btn');
        const googleBtn = document.getElementById('google-btn');
        const divider = document.getElementById('divider');

        const usernameGroup = document.getElementById('username-group');
        const passwordGroup = document.getElementById('password-group');

        const submitBtn = document.getElementById('submit-btn');
        const usernameInput = document.getElementById('username');
        const loginInput = document.getElementById('login-identifier');
        const passwordInput = document.getElementById('password');
        const usernameStatus = document.getElementById('username-status');
        const loginStatus = document.getElementById('login-status');

        const togglePasswordBtn = document.getElementById('toggle-password-btn');
        const eyeIcon = document.getElementById('eye-icon');
        const loginOptions = document.getElementById('login-options');
        const rememberMeLabel = document.getElementById('remember-me-label');
        const forgotPasswordLink = document.getElementById('forgot-password-link');
        const termsText = document.getElementById('terms-text');

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const usernameRegex = /^[a-zA-Z0-9_-]+$/;

        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            
            eyeIcon.innerHTML = isPassword 
                ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`
                : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
        });

        function updateFormUI(mode) {
            currentMode = mode;
            loginStatus.textContent = '';
            usernameStatus.textContent = '';

            if (mode === 'signup') {
                backBtn.style.display = 'none';
                title.textContent = 'Sign Up';
                prompt.style.display = 'block';
                prompt.childNodes[0].textContent = 'Already have an account? ';
                toggleBtn.textContent = 'Log in';
                googleBtn.style.display = 'flex';
                divider.style.display = 'flex';
                
                usernameGroup.classList.remove('collapsed');
                passwordGroup.classList.remove('collapsed');
                
                loginInput.placeholder = 'Email address';
                loginOptions.style.display = 'none'; // Полностью скрыт в Sign Up
                
                termsText.style.display = 'block';
                submitBtn.textContent = 'Create Account';
            } else if (mode === 'login') {
                backBtn.style.display = 'none';
                title.textContent = 'Log In';
                prompt.style.display = 'block';
                prompt.childNodes[0].textContent = "Don't have an account? ";
                toggleBtn.textContent = 'Sign up';
                googleBtn.style.display = 'flex';
                divider.style.display = 'flex';

                usernameGroup.classList.add('collapsed');
                passwordGroup.classList.remove('collapsed');

                loginInput.placeholder = 'Username or Email';
                loginOptions.style.display = 'flex'; // Отображается только в Log In
                rememberMeLabel.style.display = 'flex';
                forgotPasswordLink.style.display = 'inline';

                termsText.style.display = 'none';
                submitBtn.textContent = 'Log In';
            } else if (mode === 'forgot') {
                backBtn.style.display = 'inline-flex';
                title.textContent = 'Reset Password';
                prompt.style.display = 'none';
                googleBtn.style.display = 'none';
                divider.style.display = 'none';

                usernameGroup.classList.add('collapsed');
                passwordGroup.classList.add('collapsed');

                loginInput.placeholder = 'Enter your email address';
                loginOptions.style.display = 'none';
                termsText.style.display = 'none';
                submitBtn.textContent = 'Send Reset Link';
            }
        }

        toggleBtn.addEventListener('click', () => {
            updateFormUI(currentMode === 'signup' ? 'login' : 'signup');
        });

        backBtn.addEventListener('click', () => {
            updateFormUI('login');
        });

        forgotPasswordLink.addEventListener('click', (e) => {
            e.preventDefault();
            updateFormUI('forgot');
        });

        function validateIdentifier() {
            const val = loginInput.value.trim();
            if (!val) {
                loginStatus.textContent = '';
                return false;
            }

            if (currentMode === 'signup' || currentMode === 'forgot') {
                if (!emailRegex.test(val)) {
                    loginStatus.textContent = 'Please enter a valid email address';
                    loginStatus.className = 'status-msg invalid';
                    return false;
                }
                if (currentMode === 'signup') {
                    if (takenEmails.includes(val.toLowerCase())) {
                        loginStatus.textContent = 'Email is already registered';
                        loginStatus.className = 'status-msg taken';
                        return false;
                    }
                    loginStatus.textContent = 'Email is available';
                    loginStatus.className = 'status-msg available';
                } else {
                    loginStatus.textContent = '';
                }
                return true;
            } else {
                loginStatus.textContent = '';
                return true;
            }
        }

        function validateUsername() {
            if (currentMode !== 'signup') return true;
            const val = usernameInput.value.trim();

            if (!val) {
                usernameStatus.textContent = '';
                return false;
            }

            if (!usernameRegex.test(val)) {
                usernameStatus.textContent = 'Only English letters, numbers, _ and - allowed';
                usernameStatus.className = 'status-msg invalid';
                return false;
            }

            if (takenUsernames.includes(val.toLowerCase())) {
                usernameStatus.textContent = 'Username is already taken';
                usernameStatus.className = 'status-msg invalid';
                return false;
            }

            usernameStatus.textContent = 'Username is available';
            usernameStatus.className = 'status-msg available';
            return true;
        }

        loginInput.addEventListener('blur', validateIdentifier);
        loginInput.addEventListener('input', () => {
            if (loginStatus.classList.contains('invalid')) {
                loginStatus.textContent = '';
            }
        });

        usernameInput.addEventListener('input', validateUsername);

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            if (currentMode === 'forgot') {
                if (!validateIdentifier()) return;
                alert(`Password reset link has been sent to ${loginInput.value.trim()}`);
                updateFormUI('login');
                return;
            }

            const isLoginValid = validateIdentifier();
            const isUsernameValid = validateUsername();

            if (!isLoginValid || (currentMode === 'signup' && !isUsernameValid)) {
                return;
            }

            alert(currentMode === 'signup' ? 'Account created successfully!' : 'Logged in successfully!');
        });
    </script>

</body>
</html>
