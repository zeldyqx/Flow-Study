<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Study — Auth</title>
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            height: 100vh;
            background-color: #18181b;
            overflow: hidden;
            position: relative;
            display: flex;
        }

        /* Right Hero Section */
        .hero-section {
            position: absolute;
            top: 0;
            right: 0;
            width: 60vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            padding-right: 12vw;
            color: #ffffff;
            z-index: 0;
        }

        .hero-content {
            max-width: 420px;
        }

        .hero-title {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.8rem;
        }

        .hero-description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #a1a1aa;
            font-weight: 400;
        }

        .hero-links {
            position: absolute;
            bottom: 3rem;
            right: 12vw;
            display: flex;
            gap: 2rem;
        }

        .hero-links a {
            color: #888888;
            font-size: 1.05rem;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .hero-links a:hover {
            color: #ffffff;
        }

        /* Left white diagonal section */
        .white-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 48vw;
            height: 100vh;
            background: #ffffff;
            clip-path: polygon(0 0, 70% 0, 100% 100%, 0 100%);
            display: flex;
            align-items: center;
            padding-left: 6%;
            z-index: 1;
        }

        .auth-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #eaeaea;
            width: 340px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: none;
            border: none;
            color: #555555;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 1rem;
            padding: 0;
            transition: color 0.2s ease;
        }

        .back-btn:hover {
            color: #000000;
        }

        .back-btn svg {
            width: 16px;
            height: 16px;
        }

        .header-container {
            margin-bottom: 1.2rem;
        }

        .auth-card h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            color: #111111;
            line-height: 1.2;
        }

        .auth-prompt {
            font-size: 0.85rem;
            color: #666666;
            line-height: 1.2;
        }

        .auth-prompt button {
            background: none;
            border: none;
            color: #000000;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            font-size: 0.85rem;
        }

        .google-btn-container {
            width: 100%;
            min-height: 40px;
            display: flex;
            justify-content: center;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.2rem 0;
            color: #aaa;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #eaeaea;
        }

        .divider span {
            padding: 0 0.6rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 0.8rem;
            min-height: 68px; 
            max-height: 100px;
            opacity: 1;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.2s ease,
                        margin-bottom 0.3s ease,
                        min-height 0.3s ease;
        }

        .input-group.collapsed {
            max-height: 0;
            min-height: 0;
            opacity: 0;
            margin-bottom: 0;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #dddddd;
            border-radius: 6px;
            background: #fdfdfd;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #000000;
            background: #ffffff;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 2.5rem;
        }

        .toggle-password {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #71717a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.2rem;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #000000;
        }

        .toggle-password svg {
            width: 18px;
            height: 18px;
        }

        .input-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: -0.4rem;
            margin-bottom: 0.8rem;
            font-size: 0.8rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: #555555;
            cursor: pointer;
            user-select: none;
        }

        .remember-me input {
            cursor: pointer;
            accent-color: #000000;
        }

        .forgot-link {
            color: #000000;
            text-decoration: none;
            font-weight: 500;
            margin-left: auto;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .status-msg {
            font-size: 0.75rem;
            margin-top: 0.2rem;
            display: block;
            min-height: 1rem;
        }

        .status-msg.available { color: #10b981; }
        .status-msg.taken, .status-msg.invalid { color: #ef4444; }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background: #000000;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 0.2rem;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #222222;
        }

        .terms-text {
            font-size: 0.75rem;
            color: #71717a;
            text-align: center;
            margin-top: 0.8rem;
            line-height: 1.3;
        }

        .terms-text a {
            color: #000000;
            text-decoration: underline;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            body {
                justify-content: center;
                align-items: center;
            }
            .hero-section {
                display: none;
            }
            .white-section {
                width: 100vw;
                clip-path: none;
                padding-left: 0;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">Flow Study</h1>
            <p class="hero-description">
                Your study notes, minus the chaos. Organize lectures, break down heavy topics, and actually retain what you learn.
            </p>
        </div>

        <div class="hero-links">
            <a href="#">About</a>
            <a href="#">Features</a>
            <a href="#">Privacy</a>
        </div>
    </div>

    <div class="white-section">
        <div class="auth-card">
            <button type="button" class="back-btn" id="back-btn" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to login
            </button>

            <div class="header-container">
                <h2 id="form-title">Sign Up</h2>
                <p class="auth-prompt" id="form-prompt">
                    Already have an account? <button type="button" id="toggle-btn">Log in</button>
                </p>
            </div>

            <div class="google-btn-container" id="google-btn-container">
                <div id="g_id_onload"
                     data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                     data-callback="handleGoogleResponse">
                </div>
                <div class="g_id_signin" 
                     data-type="standard" 
                     data-shape="rectangular" 
                     data-theme="outline" 
                     data-text="continue_with" 
                     data-size="large" 
                     data-logo_alignment="left"
                     data-width="240">
                </div>
            </div>

            <div class="divider" id="divider">
                <span>OR</span>
            </div>
            
            <form id="auth-form" novalidate>
                <div class="input-group" id="username-group">
                    <input type="text" id="username" placeholder="Username" autocomplete="off">
                    <span class="status-msg" id="username-status"></span>
                </div>
                
                <div class="input-group" id="login-group">
                    <input type="text" id="login-identifier" placeholder="Email address" autocomplete="off">
                    <span class="status-msg" id="login-status"></span>
                </div>
                
                <div class="input-group" id="password-group">
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Password">
                        <button type="button" class="toggle-password" id="toggle-password-btn" aria-label="Toggle password visibility">
                            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <span class="status-msg" id="password-status"></span>
                </div>

                <div class="input-options" id="login-options" style="display: none;">
                    <label class="remember-me" id="remember-me-label">
                        <input type="checkbox" id="remember-me-checkbox">
                        Remember me
                    </label>
                    <a href="#" class="forgot-link" id="forgot-password-link">Forgot password?</a>
                </div>
                
                <button type="submit" class="submit-btn" id="submit-btn">Create Account</button>

                <p class="terms-text" id="terms-text">
                    By signing up, you agree to our <a href="#">Terms</a> & <a href="#">Privacy Policy</a>.
                </p>
            </form>
        </div>
    </div>

<script>
    let currentMode = 'signup';

    function getUsersDB() {
        const users = localStorage.getItem('flowstudy_users');
        return users ? JSON.parse(users) : [
            { id: 1, username: 'admin', email: 'admin@mail.com', password: 'password123' },
            { id: 2, username: 'alex', email: 'alex@mail.com', password: 'password123' },
            { id: 3, username: 'kywy', email: 'kywy@mail.com', password: 'password123' }
        ];
    }

    function saveUserToDB(newUser) {
        const users = getUsersDB();
        users.push(newUser);
        localStorage.setItem('flowstudy_users', JSON.stringify(users));
    }

    function setSession(user) {
        const usernameToSave = user.username || user.name || 'User';
        
        localStorage.setItem('flowstudy_session', JSON.stringify({
            id: user.id,
            username: usernameToSave,
            email: user.email,
            isLoggedIn: true
        }));

        localStorage.setItem('flowstudy_username', usernameToSave);
        window.location.href = 'main.html';
    }

    function decodeJwtResponse(token) {
        let base64Url = token.split('.')[1];
        let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        let jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    }

    window.handleGoogleResponse = function(response) {
        const responsePayload = decodeJwtResponse(response.credential);
        const users = getUsersDB();
        
        let user = users.find(u => u.email.toLowerCase() === responsePayload.email.toLowerCase());
        
        if (!user) {
            user = {
                id: users.length + 1,
                username: responsePayload.name,
                email: responsePayload.email,
                password: ''
            };
            saveUserToDB(user);
        }
        
        setSession(user);
    };

    const form = document.getElementById('auth-form');
    const title = document.getElementById('form-title');
    const prompt = document.getElementById('form-prompt');
    const toggleBtn = document.getElementById('toggle-btn');
    const backBtn = document.getElementById('back-btn');
    const googleBtnContainer = document.getElementById('google-btn-container');
    const divider = document.getElementById('divider');

    const usernameGroup = document.getElementById('username-group');
    const passwordGroup = document.getElementById('password-group');

    const submitBtn = document.getElementById('submit-btn');
    const usernameInput = document.getElementById('username');
    const loginInput = document.getElementById('login-identifier');
    const passwordInput = document.getElementById('password');
    const usernameStatus = document.getElementById('username-status');
    const loginStatus = document.getElementById('login-status');
    const passwordStatus = document.getElementById('password-status');

    const togglePasswordBtn = document.getElementById('toggle-password-btn');
    const eyeIcon = document.getElementById('eye-icon');
    const loginOptions = document.getElementById('login-options');
    const rememberMeLabel = document.getElementById('remember-me-label');
    const forgotPasswordLink = document.getElementById('forgot-password-link');
    const termsText = document.getElementById('terms-text');

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const usernameRegex = /^[a-zA-Z0-9_-]+$/;

    togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        
        eyeIcon.innerHTML = isPassword 
            ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`
            : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
    });

    function updateFormUI(mode) {
        currentMode = mode;
        loginStatus.textContent = '';
        usernameStatus.textContent = '';
        passwordStatus.textContent = '';

        if (mode === 'signup') {
            backBtn.style.display = 'none';
            title.textContent = 'Sign Up';
            prompt.style.display = 'block';
            prompt.childNodes[0].textContent = 'Already have an account? ';
            toggleBtn.textContent = 'Log in';
            googleBtnContainer.style.display = 'flex';
            divider.style.display = 'flex';
            
            usernameGroup.classList.remove('collapsed');
            passwordGroup.classList.remove('collapsed');
            
            loginInput.placeholder = 'Email address';
            loginOptions.style.display = 'none';
            
            termsText.style.display = 'block';
            submitBtn.textContent = 'Create Account';
        } else if (mode === 'login') {
            backBtn.style.display = 'none';
            title.textContent = 'Log In';
            prompt.style.display = 'block';
            prompt.childNodes[0].textContent = "Don't have an account? ";
            toggleBtn.textContent = 'Sign up';
            googleBtnContainer.style.display = 'flex';
            divider.style.display = 'flex';

            usernameGroup.classList.add('collapsed');
            passwordGroup.classList.remove('collapsed');

            loginInput.placeholder = 'Username or Email';
            loginOptions.style.display = 'flex';
            rememberMeLabel.style.display = 'flex';
            forgotPasswordLink.style.display = 'inline';

            termsText.style.display = 'none';
            submitBtn.textContent = 'Log In';
        } else if (mode === 'forgot') {
            backBtn.style.display = 'inline-flex';
            title.textContent = 'Reset Password';
            prompt.style.display = 'none';
            googleBtnContainer.style.display = 'none';
            divider.style.display = 'none';

            usernameGroup.classList.add('collapsed');
            passwordGroup.classList.add('collapsed');

            loginInput.placeholder = 'Enter your email address';
            loginOptions.style.display = 'none';
            termsText.style.display = 'none';
            submitBtn.textContent = 'Send Reset Link';
        }
    }

    toggleBtn.addEventListener('click', () => {
        updateFormUI(currentMode === 'signup' ? 'login' : 'signup');
    });

    backBtn.addEventListener('click', () => {
        updateFormUI('login');
    });

    forgotPasswordLink.addEventListener('click', (e) => {
        e.preventDefault();
        updateFormUI('forgot');
    });

    function validateIdentifier() {
        const val = loginInput.value.trim();
        const users = getUsersDB();

        if (!val) {
            loginStatus.textContent = '';
            return false;
        }

        if (currentMode === 'signup' || currentMode === 'forgot') {
            if (!emailRegex.test(val)) {
                loginStatus.textContent = 'Please enter a valid email address';
                loginStatus.className = 'status-msg invalid';
                return false;
            }
            if (currentMode === 'signup') {
                if (users.some(u => u.email.toLowerCase() === val.toLowerCase())) {
                    loginStatus.textContent = 'Email is already registered';
                    loginStatus.className = 'status-msg taken';
                    return false;
                }
                loginStatus.textContent = 'Email is available';
                loginStatus.className = 'status-msg available';
            } else {
                loginStatus.textContent = '';
            }
            return true;
        } else {
            loginStatus.textContent = '';
            return true;
        }
    }

    function validateUsername() {
        if (currentMode !== 'signup') return true;
        const val = usernameInput.value.trim();
        const users = getUsersDB();

        if (!val) {
            usernameStatus.textContent = '';
            return false;
        }

        if (!usernameRegex.test(val)) {
            usernameStatus.textContent = 'Only English letters, numbers, _ and - allowed';
            usernameStatus.className = 'status-msg invalid';
            return false;
        }

        if (users.some(u => u.username.toLowerCase() === val.toLowerCase())) {
            usernameStatus.textContent = 'Username is already taken';
            usernameStatus.className = 'status-msg invalid';
            return false;
        }

        usernameStatus.textContent = 'Username is available';
        usernameStatus.className = 'status-msg available';
        return true;
    }

    loginInput.addEventListener('blur', validateIdentifier);
    loginInput.addEventListener('input', () => {
        if (loginStatus.classList.contains('invalid')) {
            loginStatus.textContent = '';
        }
    });

    usernameInput.addEventListener('input', validateUsername);

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const users = getUsersDB();

        if (currentMode === 'forgot') {
            if (!validateIdentifier()) return;
            alert(`Password reset link has been sent to ${loginInput.value.trim()}`);
            updateFormUI('login');
            return;
        }

        const identifierVal = loginInput.value.trim();
        const passwordVal = passwordInput.value;

        if (currentMode === 'signup') {
            const isLoginValid = validateIdentifier();
            const isUsernameValid = validateUsername();

            if (!isLoginValid || !isUsernameValid) return;
            if (!passwordVal) {
                passwordStatus.textContent = 'Password is required';
                passwordStatus.className = 'status-msg invalid';
                return;
            }

            // Назначаем ID как следующий порядковый номер
            const newUser = {
                id: users.length + 1,
                username: usernameInput.value.trim(),
                email: identifierVal,
                password: passwordVal
            };

            saveUserToDB(newUser);
            setSession(newUser);
        } else {
            if (!identifierVal || !passwordVal) {
                passwordStatus.textContent = 'Please fill in all fields';
                passwordStatus.className = 'status-msg invalid';
                return;
            }

            const user = users.find(u => 
                (u.email.toLowerCase() === identifierVal.toLowerCase() || 
                 u.username.toLowerCase() === identifierVal.toLowerCase()) && 
                u.password === passwordVal
            );

            if (user) {
                setSession(user);
            } else {
                passwordStatus.textContent = 'Invalid username/email or password';
                passwordStatus.className = 'status-msg invalid';
            }
        }
    });
</script>
