<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Study</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            overflow: hidden;
        }

        /* Dark Sidebar */
        .sidebar {
            width: 240px;
            height: 100vh;
            background-color: #18181b;
            border-right: 1px solid #27272a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.25rem 0.75rem;
            z-index: 10;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        /* Collapsed State */
        .sidebar.collapsed {
            width: 72px;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.25rem 0.5rem 1rem 0.5rem;
            border-bottom: 1px solid #27272a;
            margin-bottom: 1rem;
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            overflow: hidden;
            white-space: nowrap;
        }

        .brand-text-short {
            display: none;
        }

        .sidebar.collapsed .brand-text-full {
            display: none;
        }

        .sidebar.collapsed .brand-text-short {
            display: inline;
        }

        /* Toggle Button */
        .toggle-sidebar-btn {
            background: none;
            border: none;
            color: #a1a1aa;
            cursor: pointer;
            padding: 0.4rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .toggle-sidebar-btn:hover {
            color: #ffffff;
            background: #27272a;
        }

        .toggle-sidebar-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Navigation */
        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.65rem 0.75rem;
            color: #a1a1aa;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.2s ease;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
        }

        .nav-item:hover {
            color: #ffffff;
            background: #27272a;
        }

        .nav-item.active {
            color: #ffffff;
            background: #27272a;
        }

        .nav-item svg {
            min-width: 18px;
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sidebar.collapsed .nav-text {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        .sidebar-bottom {
            border-top: 1px solid #27272a;
            padding-top: 0.75rem;
        }

        /* Main Workspace Section */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #ffffff;
        }

        /* Top Header Bar */
        .top-header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 2rem;
            gap: 0.75rem;
            border-bottom: 1px solid #eaeaea;
            background-color: #ffffff;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #555555;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            color: #000000;
            background: #f4f4f5;
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .badge-dot {
            position: absolute;
            top: 9px;
            right: 9px;
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            border: 2px solid #ffffff;
        }

        /* Profile Button */
        .profile-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: none;
            border: none;
            padding: 0.35rem 0.6rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .profile-btn:hover {
            background: #f4f4f5;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #18181b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            color: #ffffff;
        }

        .profile-info {
            text-align: left;
            display: flex;
            flex-direction: column;
        }

        .profile-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #111111;
            line-height: 1.1;
        }

        .profile-role {
            font-size: 0.75rem;
            color: #666666;
            margin-top: 2px;
        }

        .content {
            flex: 1;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="brand-header">
                <div class="brand">
                    <span class="brand-text-full">Flow Study</span>
                    <span class="brand-text-short">FS</span>
                </div>
                <button class="toggle-sidebar-btn" id="toggle-btn" aria-label="Toggle Sidebar">
                    <svg id="toggle-icon" viewBox="0 0 24 24">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
            </div>

            <ul class="nav-list">
                <li>
                    <a href="#" class="nav-item active">
                        <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        <span class="nav-text">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-item">
                        <svg viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path></svg>
                        <span class="nav-text">Notes</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="nav-item">
                        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        <span class="nav-text">Schedule</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="sidebar-bottom">
            <a href="#" class="nav-item" id="settings-btn">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span class="nav-text">Settings</span>
            </a>
        </div>
    </aside>

    <main class="main-wrapper">
        <header class="top-header">
            <button class="icon-btn" aria-label="Notifications">
                <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span class="badge-dot"></span>
            </button>

            <button class="profile-btn">
                <div class="avatar">K</div>
                <div class="profile-info">
                    <span class="profile-name">Kywy</span>
                    <span class="profile-role">Developer</span>
                </div>
            </button>
        </header>

        <section class="content">
        </section>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-btn');
        const toggleIcon = document.getElementById('toggle-icon');

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            
            if (sidebar.classList.contains('collapsed')) {
                toggleIcon.innerHTML = '<polyline points="9 18 15 12 9 6"></polyline>';
            } else {
                toggleIcon.innerHTML = '<polyline points="15 18 9 12 15 6"></polyline>';
            }
        });
    </script>

</body>
</html>
